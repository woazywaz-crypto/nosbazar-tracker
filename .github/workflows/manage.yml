name: Ajouter ou retirer un objet

# Déclenché par les boutons « Ajouter » / « ✕ » de la page de suivi,
# qui créent une issue « Ajouter : … » ou « Retirer : … ».
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: releve-prix
  cancel-in-progress: false

jobs:
  gerer:
    # seulement les demandes du propriétaire du dépôt
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, 'Ajouter') || startsWith(github.event.issue.title, 'Retirer'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Modifier la liste
        id: manage
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          RESULT_FILE: ${{ runner.temp }}/result.md
          OBJETS_FILE: ${{ runner.temp }}/objets.txt
        run: |
          set +e
          python manage.py
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Relever le prix du nouvel objet
        if: steps.manage.outputs.code == '0'
        run: |
          if [ -s "$RUNNER_TEMP/objets.txt" ]; then
            OBJETS="$(cat "$RUNNER_TEMP/objets.txt")" python tracker.py || true
          fi

      - name: Enregistrer
        if: steps.manage.outputs.code == '0'
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name "nosbazar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add items.json docs/data/prices.csv
          git diff --cached --quiet || git commit -m "$TITLE"
          git pull --rebase
          git push

      - name: Répondre et fermer la demande
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          if [ -s "$RUNNER_TEMP/result.md" ]; then
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/result.md"
          else
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "❌ Une erreur est survenue, voir l'onglet Actions."
          fi
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY"
