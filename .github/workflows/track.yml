name: Relevé des prix NosBazar

on:
  schedule:
    # Une fois par jour à 14:03 UTC, soit 15h03 en hiver et 16h03 en été (heure de Paris).
    # GitHub peut décaler un peu les lancements planifiés.
    - cron: "3 14 * * *"
  workflow_dispatch:
    inputs:
      tout_relever:
        description: "Relever tous les objets (c'est aussi le cas si le champ ci-dessous est vide)"
        type: boolean
        default: false
      objets:
        description: "Ne relever que ces objets (numéros séparés par des virgules, rempli par le bouton Favoris de la page)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: releve-prix
  cancel-in-progress: false

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Relever les prix
        env:
          # Lancement manuel sans numéros d'objets : on relève tout
          FORCE_ALL: ${{ (inputs.tout_relever || (github.event_name == 'workflow_dispatch' && inputs.objets == '')) && '1' || '' }}
          OBJETS: ${{ inputs.objets }}
        run: python tracker.py

      - name: Enregistrer le CSV
        run: |
          git config user.name "nosbazar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/prices.csv
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Relevé du $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
